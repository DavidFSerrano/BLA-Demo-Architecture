# Build the booking API, fail the job if Trivy finds a fixable high or critical
# vulnerability, and push the image to ECR on main.

name: Booking API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/booking-api.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/booking-api.yml"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-2
  AWS_ROLE_ARN: arn:aws:iam::637423617446:role/github-actions-terraform-deploy
  IMAGE: 637423617446.dkr.ecr.us-east-2.amazonaws.com/bla-demo-booking-api

jobs:
  image:
    name: Build, scan, and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --platform linux/amd64 --pull -t "$IMAGE:${{ github.sha }}" api

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Configure AWS credentials via OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-booking-api-${{ github.run_id }}

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
